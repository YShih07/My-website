<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATIVE STUDIO | YU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 引入哥特体 (UnifrakturMaguntia) 与 毛笔行书 (Ma Shan Zheng) -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #e5e5e7; /* 浅灰色背景 */
    font-family: 'UnifrakturMaguntia', cursive, serif;
    user-select: none;
}

/* 浅灰色网格背景 */
.grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #e5e5e7;
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
}

/* 布局图层 */
.typography-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 6vh 2vw 4vh;
}

/* 顶部哥特英文字体 */
.top-title {
    font-family: 'UnifrakturMaguntia', cursive, serif;
    font-size: clamp(1.8rem, 4vw, 4.5rem);
    font-weight: 400;
    letter-spacing: .06em;
    line-height: 1.15;
    color: #1a1a1e; /* 深色文字 */
    text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
}

/* 中文行书行 */
.chinese-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(20px, 6vw, 85px);
    width: 100%;
    margin: auto 0; /* 在上下之间自然居中 */
}

.chinese-row span {
    font-family: 'Ma Shan Zheng', cursive, serif;
    font-size: clamp(3.8rem, 9vw, 10rem);
    font-weight: 400;
    line-height: 1;
    color: #111115; /* 深黑灰色书法字体 */
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s ease, color 0.3s ease;
    cursor: default;
}

/* 鼠标悬停微互动效果 */
.chinese-row span:hover {
    transform: translateY(-5px);
    color: #5b34a6; /* 触碰时微显紫色 */
}

.bottom-info {
    font-size: .75rem;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    letter-spacing: .3em;
    color: rgba(0, 0, 0, 0.45);
    text-align: center;
    font-weight: 500;
}

@media (max-width: 600px) {
    .typography-layer {
        padding-top: 8vh;
        padding-bottom: 5vh;
    }

    .chinese-row {
        gap: 4vw;
    }

    .bottom-info {
        font-size: 9px;
        letter-spacing: .15em;
    }
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<div class="typography-layer">
    <div class="top-title">
        CREATIVE<br>STUDIO YU
    </div>

    <div class="chinese-row">
        <span>禅</span>
        <span>境</span>
        <span>虚</span>
        <span>素</span>
        <span>迹</span>
    </div>

    <div class="bottom-info">
        DESIGN & EXPERIMENTAL WORK © 2026
    </div>
</div>

</body>
</html>
