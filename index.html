<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATIVE STUDIO | YU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101014;
    font-family: 'Cinzel', serif;
    user-select: none;
}

/* 背景网格 */
.grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #101014;
    background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
}

/* 3D 场景 */
#canvas-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    cursor: grab;
    touch-action: none;
}

#canvas-container:active {
    cursor: grabbing;
}

#canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
}

/* 文字层 */
.typography-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 5vh 2vw 3vh;
    pointer-events: none;
}

.top-title {
    font-size: clamp(2.2rem, 6vw, 6.5rem);
    font-weight: 900;
    letter-spacing: .12em;
    line-height: 1.05;
    color: #fff;
    text-align: center;
    text-shadow: 0 4px 30px rgba(0,0,0,.65);
}

.chinese-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(16px, 5vw, 60px);
    width: 100%;
}

.chinese-row span {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(2.8rem, 6.5vw, 7rem);
    font-weight: 900;
    line-height: 1;
    color: rgba(255,255,255,.94);
    text-shadow: 0 0 30px rgba(180,140,255,.25);
}

.bottom-info {
    font-size: .7rem;
    letter-spacing: .25em;
    color: rgba(255,255,255,.55);
    text-align: center;
}

.hint {
    position: fixed;
    z-index: 4;
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%);
    color: rgba(255,255,255,.55);
    font: 10px Arial, sans-serif;
    letter-spacing: .18em;
    text-align: center;
    pointer-events: none;
    transition: opacity .5s;
}

.loading {
    position: fixed;
    z-index: 4;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(80vw, 420px);
    color: rgba(255,255,255,.8);
    font: 12px/1.8 Arial, sans-serif;
    letter-spacing: .08em;
    text-align: center;
    pointer-events: none;
}

.loading strong {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    letter-spacing: .2em;
}

@media (max-width: 600px) {
    .typography-layer {
        padding-top: 7vh;
        padding-bottom: 4vh;
    }

    .chinese-row {
        gap: 4vw;
    }

    .bottom-info {
        font-size: 8px;
        letter-spacing: .12em;
    }

    .hint {
        bottom: 15vh;
    }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

<div class="grid-bg"></div>

<div id="canvas-container"></div>

<div class="typography-layer">
    <div class="top-title">
        CREATIVE<br>STUDIO YU
    </div>

    <div class="chinese-row">
        <span>禅</span>
        <span>境</span>
        <span>虚</span>
        <span>素</span>
        <span>迹</span>
    </div>

    <div class="bottom-info">
        DESIGN & EXPERIMENTAL WORK © 2026
    </div>
</div>

<div class="loading" id="loading">
    <strong>CREATIVE STUDIO YU</strong>
    正在加载 3D 雕塑……
</div>

<div class="hint" id="hint">
    DRAG TO ROTATE · SCROLL TO ZOOM
</div>

<script>
(() => {
    const container = document.getElementById('canvas-container');
    const loading = document.getElementById('loading');
    const hint = document.getElementById('hint');

    let scene, camera, renderer;
    let sculpture = null;
    let modelPivot = null;

    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    let rotationX = 0;
    let rotationY = 0;
    let targetRotationX = 0;
    let targetRotationY = 0;

    let zoom = 1;
    let targetZoom = 1;

    let pointerX = 0;
    let pointerY = 0;
    let clock = new THREE.Clock();

    init();
    animate();

    function init() {
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

        camera.position.set(0, 0, 7.5);

        renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance'
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x101014, 0);

        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        container.appendChild(renderer.domElement);

        // 环境光：让雕塑暗部仍保留细节
        scene.add(new THREE.AmbientLight(0xd9d4ff, 1.2));

        // 正面柔光
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
        keyLight.position.set(3, 5, 6);
        scene.add(keyLight);

        // 紫色轮廓光
        const purpleLight = new THREE.PointLight(0xa855f7, 5, 15);
        purpleLight.position.set(-4, 1, -3);
        scene.add(purpleLight);

        // 蓝色轮廓光
        const blueLight = new THREE.PointLight(0x38bdf8, 4.5, 15);
        blueLight.position.set(4, 2, -2);
        scene.add(blueLight);

        // 柔和的正面补光
        const fillLight = new THREE.PointLight(0xf5eaff, 2, 12);
        fillLight.position.set(0, -3, 5);
        scene.add(fillLight);

        // 模型旋转支点
        modelPivot = new THREE.Group();
        scene.add(modelPivot);

        loadModel();

        // 鼠标拖动旋转
        container.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);

        // 滚轮缩放
        container.addEventListener('wheel', onWheel, { passive: false });

        // 手机触控由 Pointer Events 统一处理
        window.addEventListener('resize', onResize);
    }

    function loadModel() {
        const loader = new THREE.GLTFLoader();

        // 将免费的真实人体躯干模型命名为 torso.glb，
        // 并放在本 HTML 文件的同一目录中。
        loader.load(
            './torso.glb',

            function(gltf) {
                sculpture = gltf.scene;

                // 统一使用偏冷的玻璃材质风格
                sculpture.traverse(function(object) {
                    if (!object.isMesh) return;

                    object.castShadow = false;
                    object.receiveShadow = false;

                    const oldMaterial = object.material;
                    const baseColor = oldMaterial && oldMaterial.color
                        ? oldMaterial.color.clone()
                        : new THREE.Color(0xd9d0ff);

                    object.material = new THREE.MeshPhysicalMaterial({
                        color: baseColor.lerp(
                            new THREE.Color(0xc7b6f5),
                            0.35
                        ),
                        metalness: 0.12,
                        roughness: 0.22,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.14,
                        emissive: new THREE.Color(0x211033),
                        emissiveIntensity: 0.18,
                        transparent: true,
                        opacity: 0.88,
                        side: THREE.DoubleSide
                    });
                });

                // 自动计算模型大小并居中
                const bounds = new THREE.Box3().setFromObject(sculpture);
                const size = bounds.getSize(new THREE.Vector3());
                const center = bounds.getCenter(new THREE.Vector3());

                sculpture.position.sub(center);

                const maxDimension = Math.max(size.x, size.y, size.z);
                const scale = maxDimension > 0
                    ? 3.25 / maxDimension
                    : 1;

                sculpture.scale.setScalar(scale);

                modelPivot.add(sculpture);

                loading.style.display = 'none';
            },

            function(xhr) {
                if (xhr.total > 0) {
                    const progress = Math.round(
                        xhr.loaded / xhr.total * 100
                    );

                    loading.innerHTML =
                        '<strong>LOADING SCULPTURE</strong>' +
                        progress + '%';
                }
            },

            function(error) {
                console.error('3D 模型加载失败：', error);

                loading.innerHTML =
                    '<strong>MODEL NOT FOUND</strong>' +
                    '请将免费的人体模型命名为 torso.glb，' +
                    '放在 index.html 同一文件夹中。' +
                    '<br>请通过本地网页服务器打开页面。';
            }
        );
    }

    function onPointerDown(event) {
        if (event.button !== undefined && event.button !== 0) return;

        isDragging = true;
        lastX = event.clientX;
        lastY = event.clientY;

        container.setPointerCapture?.(event.pointerId);
    }

    function onPointerMove(event) {
        pointerX = (event.clientX / window.innerWidth - 0.5) * 2;
        pointerY = (event.clientY / window.innerHeight - 0.5) * 2;

        if (!isDragging) return;

        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;

        targetRotationY += dx * 0.008;
        targetRotationX += dy * 0.008;

        targetRotationX = Math.max(
            -0.9,
            Math.min(0.9, targetRotationX)
        );

        lastX = event.clientX;
        lastY = event.clientY;

        hint.style.opacity = '0';
    }

    function onPointerUp() {
        isDragging = false;
    }

    function onWheel(event) {
        event.preventDefault();

        targetZoom += event.deltaY * -0.001;
        targetZoom = Math.max(0.65, Math.min(1.7, targetZoom));
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    function animate() {
        requestAnimationFrame(animate);

        const elapsed = clock.getElapsedTime();

        if (modelPivot) {
            // 平滑跟随拖动
            rotationX += (targetRotationX - rotationX) * 0.09;
            rotationY += (targetRotationY - rotationY) * 0.09;

            modelPivot.rotation.x = rotationX;
            modelPivot.rotation.y = rotationY;

            // 没有拖动时，轻微跟随鼠标
            if (!isDragging) {
                modelPivot.rotation.y +=
                    (pointerX * 0.08) * 0.008;
                modelPivot.rotation.x +=
                    (-pointerY * 0.04) * 0.008;
            }

            // 柔和悬浮效果
            if (sculpture) {
                modelPivot.position.y =
                    Math.sin(elapsed * 0.8) * 0.045;
            }

            zoom += (targetZoom - zoom) * 0.12;
            modelPivot.scale.setScalar(zoom);
        }

        renderer.render(scene, camera);
    }
})();
</script>

</body>
</html>
