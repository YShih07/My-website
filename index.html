<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATIVE STUDIO | YU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 引入哥特体 (UnifrakturMaguntia) 与 毛笔行书 (Ma Shan Zheng) -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #e5e5e7;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none;
}

/* 浅灰色网格背景 */
.grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #e5e5e7;
    background-image:
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
}

/* 1. 首页视图 */
.main-view {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 6vh 2vw 4vh;
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.main-view.hidden {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
}

.top-title {
    font-family: 'UnifrakturMaguntia', cursive, serif;
    font-size: clamp(1.8rem, 4vw, 4.5rem);
    font-weight: 400;
    letter-spacing: .06em;
    line-height: 1.15;
    color: #1a1a1e;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
}

.chinese-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(20px, 6vw, 85px);
    width: 100%;
    margin: auto 0;
}

.chinese-row span {
    font-family: 'Ma Shan Zheng', cursive, serif;
    font-size: clamp(3.8rem, 9vw, 10rem);
    font-weight: 400;
    line-height: 1;
    color: #111115;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s ease, color 0.3s ease;
    cursor: pointer;
}

.chinese-row span:hover {
    transform: translateY(-8px) scale(1.05);
    color: #5b34a6;
}

.bottom-info {
    font-size: .75rem;
    letter-spacing: .3em;
    color: rgba(0, 0, 0, 0.45);
    text-align: center;
    font-weight: 500;
}

/* 2. 主题板块详情视图 */
.detail-view {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    padding: 6vh 8vw;
    background-color: rgba(229, 229, 231, 0.96);
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(30px);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    overflow-y: auto;
}

.detail-view.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

/* 返回按钮 */
.back-btn {
    align-self: flex-start;
    font-family: 'UnifrakturMaguntia', cursive, serif;
    font-size: 1.2rem;
    color: #1a1a1e;
    cursor: pointer;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4vh;
    transition: color 0.3s ease, transform 0.3s ease;
}

.back-btn:hover {
    color: #5b34a6;
    transform: translateX(-5px);
}

.detail-header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 3vh;
    border-bottom: 1px solid rgba(0,0,0,0.12);
    padding-bottom: 2vh;
}

.detail-char {
    font-family: 'Ma Shan Zheng', cursive, serif;
    font-size: clamp(4rem, 8vw, 7rem);
    color: #5b34a6;
    line-height: 1;
}

.detail-pinyin {
    font-family: 'UnifrakturMaguntia', cursive, serif;
    font-size: clamp(1.8rem, 3.5vw, 3rem);
    color: #111115;
    letter-spacing: 0.08em;
}

.detail-body {
    max-width: 800px;
    font-size: 1.05rem;
    line-height: 1.8;
    color: #2c2c32;
    font-weight: 400;
}

.detail-body p {
    margin-bottom: 1.5rem;
}

/* 占位作品展示格 */
.work-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 4vh;
}

.work-card {
    height: 180px;
    border: 1px dashed rgba(0,0,0,0.2);
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgba(0,0,0,0.4);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
}

@media (max-width: 600px) {
    .main-view {
        padding-top: 8vh;
        padding-bottom: 5vh;
    }
    .chinese-row {
        gap: 4vw;
    }
    .detail-view {
        padding: 5vh 5vw;
    }
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<!-- 1. 首页视图 -->
<div class="main-view" id="mainView">
    <div class="top-title">
        CREATIVE<br>STUDIO YU
    </div>

    <div class="chinese-row">
        <span onclick="openDetail('chan')">禅</span>
        <span onclick="openDetail('jing')">境</span>
        <span onclick="openDetail('xu')">虚</span>
        <span onclick="openDetail('su')">素</span>
        <span onclick="openDetail('ji')">迹</span>
    </div>

    <div class="bottom-info">
        DESIGN & EXPERIMENTAL WORK © 2026
    </div>
</div>

<!-- 2. 板块详情视图 -->
<div class="detail-view" id="detailView">
    <button class="back-btn" onclick="closeDetail()">← BACK TO MAIN</button>

    <div class="detail-header">
        <div class="detail-char" id="detailChar">禅</div>
        <div class="detail-pinyin" id="detailPinyin">CHÁN / STILLNESS</div>
    </div>

    <div class="detail-body">
        <p id="detailDesc">去繁就简，极简主义核心美学展示空间。</p>

        <!-- 展示作品区域 -->
        <div class="work-grid">
            <div class="work-card">PROJECT / WORK 01</div>
            <div class="work-card">PROJECT / WORK 02</div>
            <div class="work-card">PROJECT / WORK 03</div>
        </div>
    </div>
</div>

<script>
    // 5个板块的数据定义
    const contentData = {
        chan: {
            char: '禅',
            pinyin: 'CHÁN / STILLNESS',
            desc: '移除一切多余的干扰，探索极致的宁静与平衡。禅意不仅是视觉上的减法，更是对核心内涵的提炼。'
        },
        jing: {
            char: '境',
            pinyin: 'JÌNG / REALM',
            desc: '构建沉浸式的空间场域与氛围感。通过视觉光影与质感的交织，将艺术理念转化为可被感知的境界。'
        },
        xu: {
            char: '虚',
            pinyin: 'XŪ / VOID',
            desc: '虚实相生，留白艺术。在空灵与透明的结构中，探寻未被定义的灵感与无限可能性。'
        },
        su: {
            char: '素',
            pinyin: 'SÙ / PURITY',
            desc: '回归材质与形式最本真的质感。纯粹、天然、未经粉饰的极简线条与自然纹理表达。'
        },
        ji: {
            char: '迹',
            pinyin: 'JÌ / TRACE',
            desc: '时间的沉淀与创作的痕迹。每一个项目都是理念在现实世界中留下的独特印记。'
        }
    };

    function openDetail(key) {
        const data = contentData[key];
        if (!data) return;

        document.getElementById('detailChar').innerText = data.char;
        document.getElementById('detailPinyin').innerText = data.pinyin;
        document.getElementById('detailDesc').innerText = data.desc;

        document.getElementById('mainView').classList.add('hidden');
        document.getElementById('detailView').classList.add('active');
    }

    function closeDetail() {
        document.getElementById('detailView').classList.remove('active');
        document.getElementById('mainView').classList.remove('hidden');
    }
</script>

</body>
</html>
